<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nissan Leaf - Battery Jig</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .viewer-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe.js-jig-viewer {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      border: none;
    }
  </style>
</head>
<body>
  <div class="viewer-wrapper">
    <iframe
      class="js-jig-viewer"
      src="https://viewer.jig.space/?jig=pO8WADmK&step=1&sbox=1&autoload=1"
      allow="fullscreen; xr-spatial-tracking;"
      allowfullscreen
      frameborder="0"
    ></iframe>
  </div>

  <script src="https://viewer.jig.space/public/iframe/script.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => new JigWebViewer())</script>
</body>
</html>
